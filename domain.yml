responses:
  utter_fallback:
  - text: "Tut mir leid, ich bin mir nicht sicher, was du meinst. Frag mich gerne zu Themen rund um Mülltrennung und Recycling!"
  - text: "Ups, das war etwas außerhalb meines Wissensgebiets. Ich helfe dir gerne bei Fragen zur Mülltrennung!"
  - text: "Das habe ich leider nicht verstanden. Kann ich dir bei etwas zum Thema Abfalltrennung weiterhelfen?"
  - text: "Entschuldigung, ich komme nicht ganz mit. Falls du Fragen zur Abfalltrennung hast, bin ich hier!"
  - text: "Sorry, das war nicht ganz klar für mich. Frag mich gerne etwas zu Müllentsorgung oder Recycling in Frankfurt."

  utter_einführung:
  - text: "Hallo und willkommen! Ich bin dein digitaler Assistent für die Mülltrennung in Frankfurt am Main. Frag mich einfach nach Informationen zu FES-Abfallentsorgungsterminen, den Inhalten der verschiedenen Tonnen oder zu speziellen Entsorgungen wie Schadstoffsammlung, Sperrmüll oder Wertstoffhöfen."
  - text: "Hi! Ich bin dein Assistent für die Mülltrennung in Frankfurt. Hast du Fragen zu den Entsorgungsterminen, den Tonneninhalten oder zur Entsorgung von Schadstoffen und Sperrmüll? Ich helfe dir gerne weiter!"
  - text: "Guten Tag! Ich bin hier, um dir bei der Mülltrennung in Frankfurt zu helfen. Brauchst du Infos zu Abfallentsorgungsterminen, was in die einzelnen Tonnen gehört oder zu speziellen Entsorgungen wie Wertstoffhöfen und Sperrmüll? Frag mich einfach!"
  - text: "Hallo! Als dein Assistent für die Mülltrennung in Frankfurt stehe ich dir für alle Fragen bereit – sei es zu den FES-Entsorgungsterminen, zu Tonneninhalten oder zu speziellen Entsorgungsmöglichkeiten. Einfach nachfragen!"
  - text: "Willkommen! Ich bin der digitale Assistent für die Mülltrennung in Frankfurt am Main. Du kannst dich bei mir über FES-Abfuhrtermine, die Inhalte der Mülltonnen oder spezielle Entsorgungsfragen wie Schadstoffsammlungen und Sperrmüll informieren. Wie kann ich dir helfen?"

  utter_bedankung:
  - text: "Gern geschehen! Lass es mich wissen wenn du weitere Fragen zur Mülltrennung in Frankfurt hast bezüglich der FES, Abfallentsorgungstermine, der Inhalt von einzelnen Tonnen oder spezielle Entsorgungen (Schadstoff, Sperrmüll, Wertstoffhof)."
  - text: "Immer gern! Bei weiteren Fragen zur Mülltrennung, den FES-Abfuhrterminen oder speziellen Entsorgungsmöglichkeiten bin ich hier, um dir zu helfen."
  - text: "Freut mich, dass ich helfen konnte! Bei weiteren Fragen zur Mülltrennung Freut mich, dass ich helfen konnte! Bei weiteren Fragen zur Mülltrennung oder speziellen Entsorgungen in Frankfurt stehe ich dir jederzeit zur Seite."
  - text: "Kein Problem! Ich helfe dir gerne weiter. Wenn du noch etwas zur Mülltrennung oder zu speziellen Entsorgungen wie Schadstoff- oder Sperrmüllabgabe wissen möchtest, frag einfach nach!"
  - text: "Sehr gerne! Falls du noch mehr über die Abfallentsorgung in Frankfurt wissen möchtest – sei es zu Terminen, Tonnen oder speziellen Entsorgungen – frag ruhig nach!"

  utter_verabschiedung:
  - text: "Tschüss und danke, dass du zur Mülltrennung beiträgst!"
  - text: "Bis bald! Wenn du Fragen hast, bin ich für dich da."
  - text: "Schönen Tag noch und denk an die richtige Tonne!"
  - text: "Ciao! Denk dran: Jede Trennung zählt."
  - text: "Auf Wiedersehen! Viel Erfolg beim Mülltrennen!"

  utter_fes_definition:
  - text: "Die FES ist die Frankfurter Entsorgungs- und Service GmbH. Sie ist das Unternehmen, das für die Abfallentsorgung, Straßenreinigung und weitere Dienstleistungen rund um Entsorgung und Recycling in Frankfurt am Main zuständig ist. Neben der regelmäßigen Müllabholung bietet die FES auch spezielle Services wie Sperrmüllabholung, Schadstoffsammlungen und die Betreuung von Wertstoffhöfen an."

  utter_fes_kontakt:
  - text: "Die FES Frankfurter Entsorgungs- und Service GmbH erreichst du über folgende Kontaktdaten:\n
          - Telefonnummer: 0800 2008007-0 (Mo-Fr von 8:00 bis 18:00 Uhr)\n
          - E-Mail: services@fes-frankfurt.de\n
          - Adresse: Weidenbornstraße 40, 60389 Frankfurt am Main\n
          - Website: https://www.fes-frankfurt.de/"

  utter_fes_standort:
  - text: "Die FES Frankfurter Entsorgungs- und Service GmbH hat ihren Hauptsitz in der Weidenbornstraße 40, 60389 Frankfurt am Main. Dort findest du auch das Kundenzentrum, wo du persönliche Anliegen klären kannst. Die FES hat viele weitere Orte für verschiedene Zwecke."

  utter_abfallentsorgung_müllabholungstermin:
  - text: "Im Abfallkalender unter https://www.fes-frankfurt.de/services/abfallkalender kannst du ganz einfach die Abholzeiten für deinen Müll herausfinden. Wähle deine Adresse aus, und du siehst alle relevanten Abholtermine. Die Daten lassen sich zusätzlich als PDF speichern, per Mail senden oder als Kalendereintrag exportieren."
  - text: "Du kannst im Abfallkalender (https://www.fes-frankfurt.de/services/abfallkalender) nachsehen, wann die Müllabholung bei dir stattfindet. Gib einfach deine Straße und Hausnummer ein, und du erhältst die Termine für die verschiedenen Abfallarten direkt an deinem Standort. Du kannst die Termine sogar in die Vergangenheit oder Zukunft anpassen und sie als PDF, per E-Mail oder als Kalendereintrag exportieren."
  - text: "Um die Abholtermine für deinen Müll zu erfahren, wirf einen Blick in den Abfallkalender unter https://www.fes-frankfurt.de/services/abfallkalender. Nach Eingabe deiner Straße und Hausnummer siehst du die spezifischen Abholtage für die jeweiligen Abfallarten. Du kannst auch weiter in die Zukunft oder Vergangenheit navigieren und die Termine bequem als PDF, per Mail oder Kalenderimport nutzen."
  - text: "Den nächsten Abholtermin findest du ganz einfach über den Abfallkalender (https://www.fes-frankfurt.de/services/abfallkalender). Trage dort deine Straße und Hausnummer ein, und du siehst die Daten für die Abholung aller Abfallarten. Die Termine lassen sich auch in einen Kalender übertragen, per E-Mail zusenden oder als PDF speichern."
  - text: "Schau im Abfallkalender (https://www.fes-frankfurt.de/services/abfallkalender) nach, wann deine Müllabholung geplant ist. Mit Eingabe deiner Adresse werden dir die Abholtermine angezeigt, und du kannst sie in die Vergangenheit und Zukunft verschieben. Für mehr Flexibilität kannst du die Termine als PDF exportieren, per Mail abonnieren oder deinem Kalender hinzufügen."

  utter_abfallentsorgung_wertstoffhof:
  - text: "Der Wertstoffhof ist eine Sammelstelle, an der die Bürger verschiedene Abfälle und Wertstoffe abgeben können, die nicht in den normalen Hausmüll gehören. Die FES übernimmt die schnelle und umweltgerechte Entsorgung. Es können u.a. entsorgt werden:\n
          - Sperrmüll\n
          - Metall\n
          - Hartplastik\n
          - Verpackungen\n
          - Altpapier/Pappe\n
          - Grünschnitt\n
          - Holz (unbehandelt)\n
          - Elektrogroß- und -kleingeräte\n
          - Energiesparlampen/Batterien\n
          - CDs, DVDs\n
          - Korken\n
          - Altkleider\n
          In Frankfurt gibt es 4 Wertstoffhöfe:\n
          - FES-Wertstoffhof Nord\n
                  □ Adresse: Max-Holder-Straße 29 (Kalbach-Riedberg)\n
                  □ Sommeröffnungszeiten: (01.04. – 30.09.): Mo.–Sa. 8.00–17.00 Uhr\n
            □ Winteröffnungszeiten: (01.10. – 31.03.): Mo.–Sa. 10.00–16.00 Uhr\n
          - FES-Wertstoffhof Ost\n
            □ Adresse: Weidenbornstraße 40/Einfahrt Comeniusstraße (Bornheim)\n
            □ Öffnungszeiten: Mo.–Sa. 8.00–14.30 Uhr\n
          - FES-Wertstoffhof Süd\n
            □ Adresse: Seehofstraße 48 (Sachsenhausen)\n
            □ Öffnungszeiten: Mo.–Sa. 8.00–14.30 Uhr\n
          - FES-Wertstoffhof West\n
            □ Adresse: Breuerwiesenstraße 2 (Höchst)\n
            □ Sommeröffnungszeiten (01.04. – 30.09.): Mo.–Sa. 8.00–17.00 Uhr\n
                  □ Winteröffnungszeiten (01.10. – 31.03.): Mo.–Sa. 10.00–16.00 Uhr"