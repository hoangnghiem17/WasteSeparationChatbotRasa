responses:
  utter_fallback:
  - text: "Tut mir leid, ich bin mir nicht sicher, was du meinst. Frag mich gerne zu Themen rund um Mülltrennung und Recycling!"
  - text: "Ups, das war etwas außerhalb meines Wissensgebiets. Ich helfe dir gerne bei Fragen zur Mülltrennung!"
  - text: "Das habe ich leider nicht verstanden. Kann ich dir bei etwas zum Thema Abfalltrennung weiterhelfen?"
  - text: "Entschuldigung, ich komme nicht ganz mit. Falls du Fragen zur Abfalltrennung hast, bin ich hier!"
  - text: "Sorry, das war nicht ganz klar für mich. Frag mich gerne etwas zu Müllentsorgung oder Recycling in Frankfurt."

  utter_einführung:
  - text: "Hallo und willkommen! Ich bin dein digitaler Assistent für die Mülltrennung in Frankfurt am Main. Frag mich einfach nach Informationen zu FES-Abfallentsorgungsterminen, den Inhalten der verschiedenen Tonnen oder zu speziellen Entsorgungen wie Schadstoffsammlung, Sperrmüll oder Wertstoffhöfen."
  - text: "Hi! Ich bin dein Assistent für die Mülltrennung in Frankfurt. Hast du Fragen zu den Entsorgungsterminen, den Tonneninhalten oder zur Entsorgung von Schadstoffen und Sperrmüll? Ich helfe dir gerne weiter!"
  - text: "Guten Tag! Ich bin hier, um dir bei der Mülltrennung in Frankfurt zu helfen. Brauchst du Infos zu Abfallentsorgungsterminen, was in die einzelnen Tonnen gehört oder zu speziellen Entsorgungen wie Wertstoffhöfen und Sperrmüll? Frag mich einfach!"
  - text: "Hallo! Als dein Assistent für die Mülltrennung in Frankfurt stehe ich dir für alle Fragen bereit – sei es zu den FES-Entsorgungsterminen, zu Tonneninhalten oder zu speziellen Entsorgungsmöglichkeiten. Einfach nachfragen!"
  - text: "Willkommen! Ich bin der digitale Assistent für die Mülltrennung in Frankfurt am Main. Du kannst dich bei mir über FES-Abfuhrtermine, die Inhalte der Mülltonnen oder spezielle Entsorgungsfragen wie Schadstoffsammlungen und Sperrmüll informieren. Wie kann ich dir helfen?"

  utter_bedankung:
  - text: "Gern geschehen! Lass es mich wissen wenn du weitere Fragen zur Mülltrennung in Frankfurt hast bezüglich der FES, Abfallentsorgungstermine, der Inhalt von einzelnen Tonnen oder spezielle Entsorgungen (Schadstoff, Sperrmüll, Wertstoffhof)."
  - text: "Immer gern! Bei weiteren Fragen zur Mülltrennung, den FES-Abfuhrterminen oder speziellen Entsorgungsmöglichkeiten bin ich hier, um dir zu helfen."
  - text: "Freut mich, dass ich helfen konnte! Bei weiteren Fragen zur Mülltrennung Freut mich, dass ich helfen konnte! Bei weiteren Fragen zur Mülltrennung oder speziellen Entsorgungen in Frankfurt stehe ich dir jederzeit zur Seite."
  - text: "Kein Problem! Ich helfe dir gerne weiter. Wenn du noch etwas zur Mülltrennung oder zu speziellen Entsorgungen wie Schadstoff- oder Sperrmüllabgabe wissen möchtest, frag einfach nach!"
  - text: "Sehr gerne! Falls du noch mehr über die Abfallentsorgung in Frankfurt wissen möchtest – sei es zu Terminen, Tonnen oder speziellen Entsorgungen – frag ruhig nach!"

  utter_verabschiedung:
  - text: "Tschüss und danke, dass du zur Mülltrennung beiträgst!"
  - text: "Bis bald! Wenn du Fragen hast, bin ich für dich da."
  - text: "Schönen Tag noch und denk an die richtige Tonne!"
  - text: "Ciao! Denk dran: Jede Trennung zählt."
  - text: "Auf Wiedersehen! Viel Erfolg beim Mülltrennen!"

  utter_fes_definition:
  - text: "Die FES ist die Frankfurter Entsorgungs- und Service GmbH. Sie ist das Unternehmen, das für die Abfallentsorgung, Straßenreinigung und weitere Dienstleistungen rund um Entsorgung und Recycling in Frankfurt am Main zuständig ist. Neben der regelmäßigen Müllabholung bietet die FES auch spezielle Services wie Sperrmüllabholung, Schadstoffsammlungen und die Betreuung von Wertstoffhöfen an."

  utter_fes_kontakt:
  - text: "Die FES Frankfurter Entsorgungs- und Service GmbH erreichst du über folgende Kontaktdaten:\n
          - Telefonnummer: 0800 2008007-0 (Mo-Fr von 8:00 bis 18:00 Uhr)\n
          - E-Mail: services@fes-frankfurt.de\n
          - Adresse: Weidenbornstraße 40, 60389 Frankfurt am Main\n
          - Website: https://www.fes-frankfurt.de/"

  utter_fes_standort:
  - text: "Die FES Frankfurter Entsorgungs- und Service GmbH hat ihren Hauptsitz in der Weidenbornstraße 40, 60389 Frankfurt am Main. Dort findest du auch das Kundenzentrum, wo du persönliche Anliegen klären kannst. Die FES hat viele weitere Orte für verschiedene Zwecke."

  utter_abfallentsorgung_müllabholungstermin:
  - text: "Im Abfallkalender unter https://www.fes-frankfurt.de/services/abfallkalender kannst du ganz einfach die Abholzeiten für deinen Müll herausfinden. Wähle deine Adresse aus, und du siehst alle relevanten Abholtermine. Die Daten lassen sich zusätzlich als PDF speichern, per Mail senden oder als Kalendereintrag exportieren."
  - text: "Du kannst im Abfallkalender (https://www.fes-frankfurt.de/services/abfallkalender) nachsehen, wann die Müllabholung bei dir stattfindet. Gib einfach deine Straße und Hausnummer ein, und du erhältst die Termine für die verschiedenen Abfallarten direkt an deinem Standort. Du kannst die Termine sogar in die Vergangenheit oder Zukunft anpassen und sie als PDF, per E-Mail oder als Kalendereintrag exportieren."
  - text: "Um die Abholtermine für deinen Müll zu erfahren, wirf einen Blick in den Abfallkalender unter https://www.fes-frankfurt.de/services/abfallkalender. Nach Eingabe deiner Straße und Hausnummer siehst du die spezifischen Abholtage für die jeweiligen Abfallarten. Du kannst auch weiter in die Zukunft oder Vergangenheit navigieren und die Termine bequem als PDF, per Mail oder Kalenderimport nutzen."
  - text: "Den nächsten Abholtermin findest du ganz einfach über den Abfallkalender (https://www.fes-frankfurt.de/services/abfallkalender). Trage dort deine Straße und Hausnummer ein, und du siehst die Daten für die Abholung aller Abfallarten. Die Termine lassen sich auch in einen Kalender übertragen, per E-Mail zusenden oder als PDF speichern."
  - text: "Schau im Abfallkalender (https://www.fes-frankfurt.de/services/abfallkalender) nach, wann deine Müllabholung geplant ist. Mit Eingabe deiner Adresse werden dir die Abholtermine angezeigt, und du kannst sie in die Vergangenheit und Zukunft verschieben. Für mehr Flexibilität kannst du die Termine als PDF exportieren, per Mail abonnieren oder deinem Kalender hinzufügen."

  utter_abfallentsorgung_verpasste_müllabholung:
  - text: "Falls deine Müllabholung verpasst wurde, kannst du den Vorfall bei der FES melden – online, telefonisch oder über die FES-App. Der Abfall wird dann meist zeitnah nachgeholt. Bitte lass die Tonne weiterhin zugänglich stehen."
  - text: "Bei einer ausgebliebenen Müllabholung kannst du eine Meldung bei der FES machen – entweder online, telefonisch oder per App. Die Entsorgung erfolgt in der Regel dann so schnell wie möglich. Lass die Tonne bitte weiterhin an einem zugänglichen Ort stehen."

  utter_abfallentsorgung_schadstoff:
  - text: "Nutze das Schadstoffmobil für eine sichere und fachgerechte Entsorgung der Sonderabfälle und Schadstoffe. Das Schadstoffmobil macht als mobile Sammelstelle regelmäßig an festen Orten in Frankfurt am Main halt (Online-Terminübersicht: https://www.fes-frankfurt.de/services/schadstoffsammlung). Bitte beachten Sie folgende Hinweise bei der Schadstoffannahme:\n
          - Nur haushaltsübliche Sonderabfälle von in Frankfurt gemeldeten Privatpersonen und Kleingewerbetreibenden werden angenommen\n
          - Liefere die Schadstoffe nach Arten getrennt und möglichst in Originalverpackung im Schadstoffmobil ab\n
          - Die Behältnisse müssen dicht geschlossen sein\n
          - Die Abgabemenge ist auf maximal 100kg/100l Gesamtaußenvolumen pro Tag begrenzt\n
          - Übergebe die Schadstoffabfälle direkt dem Fachpersonal im FES-Schadstoffmobil und stelle sie auf keinen Fall anonym ab\n
          Von der Sammlung ausgeschlossen sind:\n
          - Infektiöse Abfälle\n
          - Explosive Abfälle\n
          - Radioaktive Abfälle\n
          - Elektro- und Haushaltsgeräte\n
          - Autoreifen und Gasflaschen"

  utter_abfallentsorgung_sperrmüll:
  - text: "Der Sperrmüllservice bietet Haushalten eine Möglichkeit, große und sperrige Gegenstände wie Möbel, Matratzen oder Teppiche, die nicht in den normalen Hausmüll passen, entsorgen zu lassen durch eine Terminvereinbarung. Das wird entsorgt:\n
          - Alte Möbel\n
          - Elektrogeräte ab einer Kantenlänge von ca. 40 cm\n
          - Teppichböden und Laminat in haushaltsüblichen Mengen\n
          - Alle sperrigen Gegenstände, die bei einem Umzug relevant sind\n
          Das wird nicht entsorgt:\n
          - Einbauten wie Fenster und Türen\n
          - Sanitäre Einrichtungen\n
          - Kleinabfälle mit oder ohne Tüte/Behältnis\n
          - Schadstoffe wie Lacke, Farben, Sprays, Batterien oder auch Energiesparlampen/Leuchtstoffröhren \n
          - Gewerbetypische Abfälle, Autoreifen\n
          Beachte, dass zwischen Terminvergabe und Abholservice ca. 10 Arbeitstage liegen können, Terminvereinbarung erfolgt über:\n
          - Internet: unter www.fes-frankfurt.de den Sperrmüllservice anmelden\n
          - Telefon: über 0800 2008007-10 rund um die Uhr erreichbar für Sperrmüllanmeldung\n
          - Servicecenter: persönlich besprechen in Liebfrauenberg 52-54"

  utter_abfallentsorgung_wertstoffhof:
  - text: "Der Wertstoffhof ist eine Sammelstelle, an der die Bürger verschiedene Abfälle und Wertstoffe abgeben können, die nicht in den normalen Hausmüll gehören. Die FES übernimmt die schnelle und umweltgerechte Entsorgung. Es können u.a. entsorgt werden:\n
          - Sperrmüll\n
          - Metall\n
          - Hartplastik\n
          - Verpackungen\n
          - Altpapier/Pappe\n
          - Grünschnitt\n
          - Holz (unbehandelt)\n
          - Elektrogroß- und -kleingeräte\n
          - Energiesparlampen/Batterien\n
          - CDs, DVDs\n
          - Korken\n
          - Altkleider\n
          In Frankfurt gibt es 4 Wertstoffhöfe:\n
          - FES-Wertstoffhof Nord\n
                  □ Adresse: Max-Holder-Straße 29 (Kalbach-Riedberg)\n
                  □ Sommeröffnungszeiten: (01.04. – 30.09.): Mo.–Sa. 8.00–17.00 Uhr\n
            □ Winteröffnungszeiten: (01.10. – 31.03.): Mo.–Sa. 10.00–16.00 Uhr\n
          - FES-Wertstoffhof Ost\n
            □ Adresse: Weidenbornstraße 40/Einfahrt Comeniusstraße (Bornheim)\n
            □ Öffnungszeiten: Mo.–Sa. 8.00–14.30 Uhr\n
          - FES-Wertstoffhof Süd\n
            □ Adresse: Seehofstraße 48 (Sachsenhausen)\n
            □ Öffnungszeiten: Mo.–Sa. 8.00–14.30 Uhr\n
          - FES-Wertstoffhof West\n
            □ Adresse: Breuerwiesenstraße 2 (Höchst)\n
            □ Sommeröffnungszeiten (01.04. – 30.09.): Mo.–Sa. 8.00–17.00 Uhr\n
                  □ Winteröffnungszeiten (01.10. – 31.03.): Mo.–Sa. 10.00–16.00 Uhr"
                
  utter_mülltrennung_altpapier:
  - text: "Die Altpapiertonne hat einen grünen Deckel mit einem grau/schwarzen Korpus. Hierin gehören Papier und Pappe ohne Beschichtung und unbeschmutzt, sowie:\n
          - Pappen und Kartonagen\n
          - Zeitungen, Illustrierte, Kataloge\n
          - Bücher und Hefte\n
          Nicht in die Altpapiertonne kommt:\n
          - Stark verschmutztes Papier (Restmüll)\n
          - Beschichtetes Papier (Restmüll)\n
          - Pergament- und Hygienepapiere, Windeln (Restmüll)"

  utter_mülltrennung_biomüll:
  - text: "Die Biotonne hat einen braunen Deckel mit einem grau/schwarzen Korpus. Feuchte Biofälle wie Salat- oder Obst- und Gemüsereste können Sie in Zeitungs- oder Küchenpapier wickeln, um die Tonne vor starker Verschmutzung und Geruch zu schützen. Darin gehören alle biologisch abbaubaren Abfälle aus privaten Haushalten:\n
          - Obst- und Gemüseabfälle (auch Zitrusfrüchte, Bananen- und Nussschalen)\n
          - Rohe und gekochte Speise- und Lebensmittelreste\n
          - Kaffee- und Teesatz, Filtertüten, Eierschalen\n
          - Grünschnitt und Laub\n
          Nicht in die Biotonne kommt:\n
          - Plastiktüten, Verpackungen aus Kunststoff und Metall (gelbe Verpackungstonne)\n
          - Kehricht und Staubsaugerbeutel (Restmüll)\n
          - Zigarettenkippen (Restmüll)\n
          - Windeln und andere gebrauchte Hygieneartikel (Restmüll)"

  utter_mülltrennung_verpackung:
  - text: "Die Altpapiertonne hat einen gelben Deckel mit einem grau/schwarzen Korpus. Hierin gehören alle Verpackungen mit oder ohne Symbol wie den grünen Punkt, die nicht ausschließlich aus Papier, Pappe oder Glas bestehen. Die Verpackungen müssen nicht gespült aber leer sein. Dazu gehören:\n
          - Verpackungen aus Kunststoff wie Folien, Becher und Styropor\n
          - Verbundverpackungen aus Materialmix (z.B. Alu + Papier) wie Getränkekartons und Milchtüten\n
          - Verpackungen aus Metall wie Konserven- und Getränkedosen\n
          - Geschäumte Kunststoffe, z.B. Obst- und Gemüseverpackungen\n
          Nicht in die Verpackungstonne kommt:\n
          - Verpackungen aus Papier und Pappe (Altpapiertonne)\n
          - Verpackungen aus Glas (Altglascontainer)\n
          - Stark verschmutze Fast-Food-Verpackungen wie Pizzakartons (Restmüll)"

  utter_mülltrennung_restmüll:
  - text: "Die Restmülltonne hat einen grau/schwarzen Deckel und Korpus. Hierin gehören alle Abfälle, die aufgrund von Verunreinigung oder Vermischung in keine der anderen 3 Tonnen entsorgt werden können:\n
          - Hygieneartikel (z.B. Taschentücher, Damenbinden, Wattebäusche)\n
          - Windeln\n
          - Staub, Asche, Kehricht\n
          - Zigarettenkippen\n
          - Küchentücher, Putzlappen\n
          - Staubsaugerbeutel\n
          - Kleintierstreu\n
          - Trinkgläser, Porzellan, Keramik, alle Scherben\n
          Nicht in die Restmülltonne kommt:\n
          - Elektrogeräte/Schrott (Kleingeräte: Wertstoffhöfe, Großgeräte: Sperrmüll)\n
          - Batterien (spezielle Sammelbehälter in Supermärkten und öffentlichen Gebäuden)\n
          - Sonderabfall/Schadstoffe wie Farben, Lacke Sprays etc. (Schadstoffmobil)\n
          - Verpackung jeglicher Art\n
          - Bauschutt\n
          - Essensreste"

  utter_mülltrennung_altglascontainer:
  - text: "Die blauen Altglascontainer stehen im gesamten Stadtgebiet an zentralen, gut erreichbaren Plätzen und werden in der Regel alle 14 Tage geleert. Bitte nehmen Sie Rücksicht auf Ihre Mitbürgerinnen und Mitbürger und werfen das Altglas nur an Werktagen von 7.00 - 20.00 Uhr ein. In den Altglascontainer gehören gebrauchte Glasverpackungen nach den Farben weiß, grün und braun getrennt, wobei blaues oder buntes Glas zum Grünglas gehört. Das Entfernen der Deckel ist nicht notwendig. Beispiele zu was darein gehört:\n
          - Getränkeflaschen\n
          - Ketchupflaschen\n
          - Arzneimittelflaschen\n
          - Deckelgläser wie Marmeladengläser\n
          - Cremedosen\n
          - Parfumflacons\n
          Nicht in den Altglascontainer gehört:\n
          - Flachglas wie Spiegel und Scheiben\n
          - Trinkgläser und Blumenvasen\n
          - Porzellan und Keramik\n
          - Leuchtmittel jeglicher Art\n
          - Stark verschmutzte Gläser"

  utter_mülltrennung_funktionsweise:
  - text: "In Frankfurt am Main ist die Mülltrennung darauf ausgelegt, Abfälle nach Materialien zu sortieren, um das Recycling zu fördern und die Umwelt zu schonen. Bürger trennen ihren Abfall in verschiedene Kategorien wie Restmüll, Papier, Bioabfälle und Wertstoffe, um die Wiederverwertung zu ermöglichen und den Anteil an Müll zu reduzieren, der verbrannt werden muss. Es gibt darüber hinaus spezielle Sammelstellen und Abholservices für größere oder gefährliche Abfälle wie Sperrmüll und Schadstoffe. Dieses System hilft dabei, wertvolle Rohstoffe zurückzugewinnen und die Umwelt zu entlasten. Informationen und Abholtermine werden von der FES, dem Entsorgungsunternehmen in Frankfurt, zur Verfügung gestellt."

  utter_mülltrennung_wichtigkeit:
    - text: "Mülltrennung ist entscheidend, um Ressourcen zu schonen und die Umweltbelastung zu reduzieren. Durch sorgfältige Trennung können wertvolle Materialien recycelt statt verbrannt werden, was CO₂-Emissionen mindert und Energie spart. Frankfurt kämpft mit hohen Restmüllmengen, die oft aus falsch entsorgtem Papier, Plastik und organischen Abfällen bestehen. Wenn wir alle besser trennen, unterstützen wir Frankfurt direkt auf dem Weg zur Zero Waste City!"