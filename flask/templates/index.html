<!DOCTYPE html>
<html lang="en">
<head> <!--Info about document and links without displaying it to users-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rasa Waste Separation Chatbot</title>
    <link rel="stylesheet" href="style.css"> <!--Link to external CSS file-->
</head>
<body> <!--Visbile content and structure of web page-->
    <div class="container">
        <!-- Header section with logos -->
        <div class="header">
            <img src="static/frankfurt_logo.png" alt="City of Frankfurt Logo">
            <img src="static/fes_logo.png" alt="FES Logo">
            <img src="static/frauas_logo.png" alt="FRA UAS Logo">
        </div>

        <!-- Dark bar with Rasa logo -->
        <div class="rasa-bar">
            <img src="static/rasa_logo.png" alt="Powered by Rasa">
        </div>

        <!-- Chatbot interface -->
        <div class="chat-container">
            <div id="chat-window">
                <div id="messages"></div>
            </div>
            <div id="input-area">
                <input type="text" id="user-input" placeholder="Type your message here...">
                <button id="send-btn">Send</button>
            </div>
        </div>
    </div>
    <script src="static/js/app.js"></script>
</body>
</html>
