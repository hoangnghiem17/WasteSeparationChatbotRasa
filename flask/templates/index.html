<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rasa Waste Separation Chatbot</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
    <div class="container">
        <!-- Top bar with logos -->
        <div class="header">
            <img src="static/frankfurt_logo.png" alt="City of Frankfurt Logo">
            <img src="static/fes_logo.png" alt="FES Logo">
            <img src="static/frauas_logo.png" alt="FRA UAS Logo">
        </div>

        <!-- Smooth black bar with Rasa logo -->
        <div class="rasa-bar">
            <img src="static/rasa_logo.png" alt="Powered by Rasa">
            <span class="bar-text">Frankfurter Mülltrennungsassistent</span>
        </div>

        <!-- Chatbot interface -->
        <div class="chat-container">
            <div id="chat-window">
                <div id="messages">
                    <!-- Example messages -->
                    <div class="message user-message">Hi! Can you help me sort my waste?</div>
                    <div class="message bot-message">Sure! What kind of waste are you dealing with?</div>
                </div>
            </div>
            <div id="input-area">
                <input type="text" id="user-input" placeholder="Type your message here...">
                <button id="send-btn">Send</button>
            </div>
        </div>
    </div>
    <script src="static/js/app.js"></script>
</body>
</html>
